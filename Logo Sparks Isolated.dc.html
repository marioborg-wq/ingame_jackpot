<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<style>
@keyframes sparkFloat {
  0% { transform: translate(0, 0) scale(0.3); opacity: 0; }
  20% { opacity: 1; }
  100% { transform: translate(16px, -16px) scale(0.6); opacity: 0; }
}
@keyframes sparkFloatUp {
  0% { transform: translate(0, 0) scale(0.3); opacity: 0; }
  20% { opacity: 1; }
  100% { transform: translate(6px, -22px) scale(0.5); opacity: 0; }
}
</style>
</helmet>
<div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000;">
  <div style="position: relative; z-index: 0; display: flex; align-items: center; justify-content: center;">
    <span style="position: absolute; left: 97px; top: 9px; width: 4.5px; height: 4.5px; border-radius: 50%; background: #FFD98A; box-shadow: 0 0 8px 2px #FA9600, 0 0 2px #fff; animation: sparkFloat 1.8s ease-in-out infinite;"></span>
    <span style="position: absolute; left: 97px; top: 9px; width: 3px; height: 3px; border-radius: 50%; background: #FFF3C4; box-shadow: 0 0 6px 2px #FAD749, 0 0 2px #fff; animation: sparkFloatUp 2.2s ease-in-out 0.4s infinite;"></span>
    <span style="position: absolute; left: 97px; top: 9px; width: 3.5px; height: 3.5px; border-radius: 50%; background: #FFD98A; box-shadow: 0 0 7px 2px #FA9600, 0 0 2px #fff; animation: sparkFloat 2s ease-in-out 0.8s infinite;"></span>
    <img src="assets/jackpot-logo.png" alt="KTO Jackpot" style="height: 30px; width: auto; position: relative; z-index: -1;">
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:120}}"></script>
</body>
</html>
